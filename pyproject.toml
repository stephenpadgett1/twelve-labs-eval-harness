[project]
name = "video-understanding-eval-harness"
version = "0.1.0"
description = "Side-by-side eval harness for video-understanding models: Twelve Labs (Marengo + Pegasus) vs an open-source CLIP-plus-frame-sampled-LLM baseline. With an LLM-as-judge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephen Padgett" }]

dependencies = [
    "anthropic>=0.39",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
twelve-labs = ["twelvelabs>=0.4"]
clip = [
    "open-clip-torch>=2.24",
    "torch>=2.2",
    "pillow>=10.0",
    "av>=12.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
